<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Windows' own TrueType hinting: Segoe UI and Consolas render on the same pixel grid as in Windows. -->
  <match target="font">
    <test name="family" compare="eq"><string>Segoe UI</string></test>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq"><string>Consolas</string></test>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
</fontconfig>
