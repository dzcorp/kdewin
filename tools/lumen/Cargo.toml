[package]
name = "lumen"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Lumen KDE theme generator and installer"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
toml = "1.2"
resvg = "0.50"
walkdir = "2.5.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
