# Lumen design tokens — single source for every generated asset and compiled component.
# Colors: "#RRGGBB" or "#RRGGBBAA" (CSS byte order). Sizes: logical px at scale 1. Time: ms.

[meta]
id = "lumen"
name = "Lumen"
version = "0.1.0"
author = "dzcorp"
license = "GPL-3.0-or-later"
website = "https://github.com/dzcorp/kdewin"

[font]
ui = "Segoe UI Variable Static Text"
ui_small = "Segoe UI Variable Static Small"
ui_display = "Segoe UI Variable Static Display"
fallback = ["Selawik", "Inter", "Noto Sans"]
mono = "Liberation Mono"
# Used instead of ui/mono once imported from Windows (`lumen fonts`): Win32 text (Explorer views, title bars), Notepad.
win32 = "Segoe UI"
win32_mono = "Consolas"
# Windows 11 with Text size 117 % (Win32 12 px and XAML Body 14 px read small on desktop monitors).
size_pt = 10.5
# Windows "Text size" (Accessibility), percent of every size here.
text_size = 100
menu_pt = 12.3
small_pt = 10.5
mono_pt = 12.9
title_weight = 400

[type]  # px / line-height px / weight
caption = [12, 16, 400]
body = [14, 20, 400]
body_strong = [14, 20, 600]
body_large = [18, 24, 400]
subtitle = [20, 28, 600]
title = [28, 36, 600]
title_large = [40, 52, 600]
display = [68, 92, 600]

[radius]
control = 4
overlay = 8
window = 8
tooltip = 4
menu_item = 4
list_pill = 1.5
taskbar_button = 4
tile = 4
switch = 10

[size]
border = 1
focus_outer = 2
focus_inner = 1
focus_margin = 3
titlebar = 32
titlebar_icon = 16
titlebar_pad = 12
caption_button_w = 46
caption_button_h = 30
caption_glyph = 10
control_h = 32
control_h_compact = 24
control_pad_x = 11
control_pad_y = 5
input_underline = 2
checkbox = 20
radio = 20
radio_glyph = 12
radio_glyph_hover = 14
radio_glyph_pressed = 10
switch_w = 40
switch_h = 20
switch_knob = 12
switch_knob_hover = 14
slider_track = 4
slider_thumb = 20
slider_thumb_inner = 12
slider_thumb_inner_hover = 14
slider_thumb_inner_pressed = 10
scrollbar = 12
scrollbar_rest = 2
scrollbar_hover = 6
scrollbar_min_thumb = 30
menu_pad = 4
menu_pad_v = 2
# Item pitch; the highlight leaves 2 px above and below (WinUI MenuFlyoutItem margin 4,2).
menu_item_h = 32
menu_item_pad_x = 11
menu_icon = 16
menu_icon_slot = 28
menu_separator_pad = 4
list_item_h = 36
list_pill_w = 3
list_pill_h = 16
tab_h = 32
toolbar_h = 40
progress_h = 3
progress_track = 1
capacity_h = 6
tooltip_pad = [9, 6, 9, 8]
tooltip_max_w = 320
flyout_pad = 12
dialog_pad = 24
taskbar_h = 48
taskbar_icon = 24
start_icon = 32
taskbar_button = 44
taskbar_plate = 40
taskbar_indicator_active = 16
taskbar_indicator_inactive = 6
taskbar_indicator_h = 3
tray_icon = 16
qs_icon = 16
start_w = 640
start_h = 726
start_tile = 84
start_cols = 6
# Screens from 1600 px wide get the wide Start.
start_large_from = 1600
start_w_large = 834
start_h_large = 865
start_cols_large = 8
quicksettings_w = 360
quicksettings_tile_h = 48
quicksettings_cols = 3
notification_w = 364
notification_center_w = 336
osd_w = 220
osd_h = 48
switcher_thumb_w = 240
switcher_thumb_h = 150

[motion]
faster_ms = 83
fast_ms = 167
normal_ms = 250
slow_ms = 333
decel = [0.0, 0.0, 0.0, 1.0]
point = [0.55, 0.55, 0.0, 1.0]
accel = [1.0, 0.0, 1.0, 1.0]
qt_decel = "OutQuint"
qt_accel = "InCubic"
qt_point = "OutCubic"
scrollbar_expand_delay_ms = 400
scrollbar_contract_delay_ms = 500
window_open_scale = 0.92
window_close_scale = 0.96
minimize_ms = 250

# Shadow layers: [x, y, blur, alpha_dark, alpha_light]
[shadow]
window_active = [[0, 2, 8, 0.30, 0.14], [0, 16, 48, 0.40, 0.20]]
window_inactive = [[0, 1, 4, 0.22, 0.10], [0, 8, 24, 0.28, 0.12]]
flyout = [[0, 0, 8, 0.24, 0.12], [0, 14, 28, 0.28, 0.14]]
tooltip = [[0, 0, 2, 0.24, 0.12], [0, 4, 8, 0.28, 0.14]]
control = [[0, 0, 2, 0.24, 0.12], [0, 1, 2, 0.28, 0.14]]

[accent]
default = "#0078D4"
light3 = "#99EBFF"
light2 = "#60CDFF"
light1 = "#2AA8F2"
dark1 = "#005FB8"
dark2 = "#003E92"
dark3 = "#001A68"
# OKLCH shade derivation for arbitrary accents (shared by Rust, C++, QML):
# light_k: L = Lb + (lmax - Lb) * f ; dark_k: L = Lb * f ; hue kept, chroma reduced until in sRGB gamut
lmax = 0.95
light_f = [0.31, 0.62, 0.85]
dark_f = [0.875, 0.70, 0.48]

# Materials. strength/noise follow KWin scales (1..15, 0..14); saturation in percent.
[material.acrylic]
strength = 7
noise = 6
saturation = 180
# Lighter layers than WinUI's (0.96 / 0.85 luminosity): the backdrop's own light and color stay visible.
dark = { tint = "#2C2C2C", tint_opacity = 0.10, luminosity_opacity = 0.35, fallback = "#2C2C2C" }
light = { tint = "#FCFCFC", tint_opacity = 0.0, luminosity_opacity = 0.35, fallback = "#F9F9F9" }

[material.acrylic_base]
dark = { tint = "#202020", tint_opacity = 0.5, luminosity_opacity = 0.96, fallback = "#1C1C1C" }
light = { tint = "#F3F3F3", tint_opacity = 0.0, luminosity_opacity = 0.90, fallback = "#EEEEEE" }

[material.mica]
strength = 8
saturation = 170
# Percent: how strongly every material takes the wallpaper's hue (0 = off).
wallpaper_tone = 50
# Lighter tint than Windows' Mica (0.8 / 0.5): the luminosity layer already keeps text readable.
dark = { tint = "#202020", tint_opacity = 0.45, luminosity_opacity = 0.55, fallback = "#202020" }
light = { tint = "#F3F3F3", tint_opacity = 0.30, luminosity_opacity = 0.55, fallback = "#F3F3F3" }

[material.mica_alt]
dark = { tint = "#0A0A0A", tint_opacity = 0.0, luminosity_opacity = 1.0, fallback = "#0A0A0A" }
light = { tint = "#DADADA", tint_opacity = 0.50, luminosity_opacity = 1.0, fallback = "#DADADA" }

# Surface fill alpha for Plasma SVG / QML (tint the compositor blur).
# Low on purpose: the materials effect composes tint and luminosity itself; more fill turns the glass flat.
[surface]
panel_alpha = { dark = 0.40, light = 0.40 }
dialog_alpha = { dark = 0.50, light = 0.50 }
tooltip_alpha = { dark = 0.70, light = 0.70 }
osd_alpha = { dark = 0.50, light = 0.50 }
menu_alpha = { dark = 0.50, light = 0.50 }
titlebar_alpha_active = { dark = 0.0, light = 0.0 }
titlebar_alpha_inactive = { dark = 1.0, light = 1.0 }

