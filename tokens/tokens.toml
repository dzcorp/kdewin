[boot]
logo = "bgrt"            # "bgrt" (firmware/OEM logo, Windows-like) or "lumen" (generated mark)
background = "#000000"
spinner = "#FFFFFF"
spinner_dots = 5
spinner_size = 40
spinner_frames = 100     # two-step plays throbber frames at 30 fps: 3.3 s per cycle
# Windows-style boot dots: each dot runs two laps clockwise from 6 o'clock, fastest at the bottom (speed grows as
# exp(rush * drop below 12 o'clock)), then pops out; the next follows `lag` of a cycle later and `trail` degrees behind.
spinner_rush = 2.3
spinner_life = 0.795
spinner_lag = 0.041
spinner_trail = 16
limine_timeout = 3

[install]
wallpaper = "lumen"
